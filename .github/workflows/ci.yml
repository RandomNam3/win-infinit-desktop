#
# Builds everything with MSVC on x64 and ARM64 and runs the unit tests. The ARM64 runner
# is Windows 11 25H2; the x64 runner is Windows Server 2025 (same 26100 platform).
# wid-probe runs on both and its reports are kept as artifacts.

name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            msvc: x64
            qt: win64_msvc2022_64
            with_qt: 'ON'
          - arch: arm64
            runner: windows-11-arm
            msvc: arm64
            qt: ''
            with_qt: 'OFF'
    steps:
      - uses: actions/checkout@v7

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - name: Install Qt
        if: matrix.qt != ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt }}
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWID_WITH_QT=${{ matrix.with_qt }}

      - name: Build
        run: cmake --build build

      - name: Unit tests
        if: matrix.with_qt == 'ON'
        run: ctest --test-dir build --output-on-failure

      - name: Probe
        shell: pwsh
        run: |
          $probe = "build/tools/wid-probe/wid-probe.exe"
          New-Item -ItemType Directory -Force probe | Out-Null
          & $probe --help
          & $probe | Tee-Object probe/report.txt
          & $probe --json > probe/report.json
          # Needs an interactive desktop; the hosted runners have one, but report rather than fail.
          & $probe --test-move self | Tee-Object probe/test-move.txt
          & $probe --test-thumbnail | Tee-Object probe/test-thumbnail.txt
          exit 0

      - uses: actions/upload-artifact@v7
        with:
          name: wid-probe-${{ matrix.arch }}
          path: |
            build/tools/wid-probe/wid-probe.exe
            probe/

      - name: Package
        if: matrix.with_qt == 'ON'
        shell: pwsh
        # The same script builds the release zip (release.yml).
        run: ./scripts/package.ps1 -Build build -Output dist -Arch ${{ matrix.arch }}

      - name: Install and uninstall the package
        if: matrix.with_qt == 'ON'
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "win-infinit-desktop-*-${{ matrix.arch }}.zip" | Select-Object -First 1
          $dir = Join-Path $env:RUNNER_TEMP "package"
          Expand-Archive -Path $zip.FullName -DestinationPath $dir -Force
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$dir\install.ps1" -NoStart
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 failed" }
          $installed = Join-Path $env:LOCALAPPDATA "Programs\WIN Infinit Desktop"
          foreach ($exe in "win-infinit-desktop.exe", "wid-notes.exe", "wid-settings.exe") {
            if (-not (Test-Path (Join-Path $installed $exe))) { throw "$exe was not installed" }
          }
          if (-not (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "WIN Infinit Desktop" -ErrorAction SilentlyContinue)) { throw "no autostart entry" }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$dir\install.ps1" -Uninstall
          if ($LASTEXITCODE -ne 0 -or (Test-Path $installed)) { throw "uninstall failed" }

      - name: Settings app and notes app start
        if: matrix.with_qt == 'ON'
        shell: pwsh
        run: |
          # The settings app renders every page (screenshot mode: no pipes, a temporary
          # settings file); QML errors fail the step. The notes app starts and creates a note.
          $env:QT_FORCE_STDERR_LOGGING = "1"
          New-Item -ItemType Directory -Force screenshots | Out-Null
          $settings = Start-Process dist/wid-settings.exe -ArgumentList "--screenshot", "screenshots", "--screenshot-size", "1120x760" -PassThru -Wait -RedirectStandardError settings-log.txt -RedirectStandardOutput settings-out.txt
          Get-Content settings-log.txt | Select-Object -First 80
          $errors = Select-String -Path settings-log.txt -Pattern "ReferenceError|TypeError|is not defined|is not a type|Cannot assign|Unable to assign|module .* is not installed|failed to load component"
          if ($errors) { $errors | ForEach-Object { Write-Host "::error::$($_.Line)" } }
          $shots = (Get-ChildItem screenshots -Filter *.png).Count
          Write-Host "settings app: exit $($settings.ExitCode), $shots screenshots"
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "notes-appdata"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          $notes = Start-Process dist/wid-notes.exe -ArgumentList "--new-note" -PassThru -RedirectStandardError notes-log.txt
          Start-Sleep -Seconds 4
          $alive = -not $notes.HasExited
          if ($alive) { Stop-Process -Id $notes.Id -Force }
          Get-Content notes-log.txt
          $index = Join-Path $env:APPDATA "WIN Infinit Desktop\notes\index.json"
          Write-Host "notes app: running $alive, index $(Test-Path $index)"
          if ($settings.ExitCode -ne 0 -or $shots -lt 40 -or $errors -or -not $alive -or -not (Test-Path $index)) { exit 1 }

      - uses: actions/upload-artifact@v7
        if: always() && matrix.with_qt == 'ON'
        with:
          name: settings-screenshots-${{ matrix.arch }}
          path: |
            screenshots/
            settings-log.txt
            notes-log.txt

      - uses: actions/upload-artifact@v7
        if: matrix.with_qt == 'ON'
        with:
          name: win-infinit-desktop-${{ matrix.arch }}
          path: dist/

      - name: Runtime smoke test
        if: matrix.with_qt == 'ON'
        # Depends on the runner's desktop session; reported, not required.
        continue-on-error: true
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT_DIR\bin;$env:PATH"
          ./tests/runtime/smoke.ps1 -Build build

      - name: Probe summary
        if: always()
        shell: pwsh
        run: |
          foreach ($file in "probe/test-thumbnail.txt", "probe/test-move.txt", "smoke-result.txt") {
            if (Test-Path $file) { Write-Host "--- $file"; Get-Content $file }
          }

  asan:
    # Unit tests of the core and the service with AddressSanitizer (MSVC).
    name: Windows x64 ASan
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DWID_ASAN=ON -DWID_BUILD_PROBE=OFF
          cmake --build build
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  core-linux:
    # The canvas core is shared with KDE Infinit Desktop; keep it building on Linux too,
    # together with the parts of the apps that need no Windows (Qt 6.4: without the QML apps).
    name: Core on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qt6-base-dev qt6-declarative-dev ninja-build gettext
      - name: Build and test
        run: |
          cmake -S . -B build -G Ninja -DQT_MIN_VERSION=6.4
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
      - name: German catalog
        run: |
          msgfmt --check -o /dev/null po/de/win-infinit-desktop.po
          python3 tools/i18n/check_catalog.py --strict
